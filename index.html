<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saad Zubair Vohra</title>
<meta name="description" content="Personal website of Saad Zubair Vohra — launching soon.">
<style>
  :root {
    --bg: #0b0c10;
    --fg: #f5f5f7;
    --muted: #9a9ba3;
    --accent: #d4af37;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 12px;
  }
  p.tagline {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 32px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .divider {
    width: 48px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 32px;
  }
  p.note {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0;
  }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <h1>Saad Zubair Vohra</h1>
    <p class="tagline">Personal site launching soon</p>
    <div class="divider"></div>
    <p class="note">In the meantime, get in touch at <a href="mailto:hello@saadzubairvohra.com">hello@saadzubairvohra.com</a></p>
  </main>
</body>
</html>
